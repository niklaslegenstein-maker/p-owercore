
name: CorePlus Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build CorePlus
        run: mvn -B clean package

      - name: Upload CorePlus JAR
        uses: actions/upload-artifact@v4
        with:
          name: CorePlus
          path: target/CorePlus-1.0.0.jar
          if-no-files-found: error
